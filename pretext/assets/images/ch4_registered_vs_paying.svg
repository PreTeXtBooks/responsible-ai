<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img" aria-labelledby="t d">
<title id="t">Registered with SHA and active contributors</title><desc id="d">Bar chart in millions. 33.7 million registered, as the President said; 30.13 million registered beneficiaries in SHA's report to March 2026; and 4.78 million active contributors in the same report.</desc>
<rect width="700" height="330" fill="#ffffff"/>
<text x="40" y="28" font-size="17" text-anchor="start" fill="#222222" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Registered is not the same as paying</text>
<text x="40" y="48" font-size="13" text-anchor="start" fill="#555555" font-weight="normal" font-family="Arial, Helvetica, sans-serif">Millions of people. One contributor can cover a whole family, so don't divide one by the other.</text>
<text x="40" y="82" font-size="13" text-anchor="start" fill="#222222" font-weight="normal" font-family="Arial, Helvetica, sans-serif">Registered with SHA, as the President said (18 November 2026)</text>
<rect x="40" y="90" width="548.8" height="26" fill="#BDBDBD"/>
<text x="596.8285714285714" y="110" font-size="14" text-anchor="start" fill="#222222" font-weight="bold" font-family="Arial, Helvetica, sans-serif">33.7 million</text>
<text x="40" y="158" font-size="13" text-anchor="start" fill="#222222" font-weight="normal" font-family="Arial, Helvetica, sans-serif">Registered beneficiaries in SHA's report to 31 March 2026</text>
<rect x="40" y="166" width="490.7" height="26" fill="#BDBDBD"/>
<text x="538.6885714285713" y="186" font-size="14" text-anchor="start" fill="#222222" font-weight="bold" font-family="Arial, Helvetica, sans-serif">30.13 million</text>
<text x="40" y="234" font-size="13" text-anchor="start" fill="#222222" font-weight="normal" font-family="Arial, Helvetica, sans-serif">Active contributors in the same report</text>
<rect x="40" y="242" width="77.8" height="26" fill="#0072B2"/>
<text x="125.8457142857143" y="262" font-size="14" text-anchor="start" fill="#222222" font-weight="bold" font-family="Arial, Helvetica, sans-serif">4.78 million</text>
<text x="40" y="318" font-size="11" text-anchor="start" fill="#555555" font-weight="normal" font-family="Arial, Helvetica, sans-serif">Data: Africa Check (2026), citing the President's address and SHA's impact report.</text>
</svg>
