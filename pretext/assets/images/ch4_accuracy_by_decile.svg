<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" role="img" aria-labelledby="t d">
<title id="t">Prediction accuracy by spending tenth</title><desc id="d">Stacked bars for ten groups of households from poorest to richest. In the poorest tenth, 81 percent are over-predicted and 16 percent accurate. The share over-predicted falls steadily to 8 percent in the richest tenth, where 60 percent are under-predicted.</desc>
